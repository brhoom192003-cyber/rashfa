<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مِداد | MIDAD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4ecdf;
      color: #30271f;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fffaf2;
      border-bottom: 1px solid #ded0bd;
      padding: 14px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: #765536;
      font-size: 27px;
      font-weight: bold;
      text-align: center;
    }

    .logo span {
      display: block;
      font-size: 10px;
      letter-spacing: 4px;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: none;
      background: #795a3d;
      color: white;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 14px;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn-light {
      background: #eee3d3;
      color: #4b3829;
    }

    .hero {
      max-width: 1200px;
      margin: 25px auto;
      padding: 60px 7%;
      border-radius: 24px;
      background: #2b211b;
      color: #efe7d8;
    }

    .hero h1 {
      font-size: 43px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 16px;
      opacity: .85;
    }

    .hero small {
      display: block;
      margin-top: 15px;
      letter-spacing: 3px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 0 5% 50px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0;
    }

    .controls input,
    .controls select {
      flex: 1;
      min-width: 220px;
      padding: 13px;
      border: 1px solid #d6c6b2;
      border-radius: 10px;
      background: #fffaf2;
      color: #30271f;
      outline: none;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: #fffaf2;
      border: 1px solid #e1d5c4;
      border-radius: 17px;
      padding: 15px;
      overflow: hidden;
    }

    .product-image {
      height: 170px;
      border-radius: 13px;
      background: #eadfce;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      margin-bottom: 13px;
    }

    .product-card h3 {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .category {
      color: #8b765f;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .price {
      font-weight: bold;
      color: #765536;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
    }

    .product-actions button {
      flex: 1;
    }

    .account-section {
      margin-top: 45px;
      background: #fffaf2;
      padding: 25px;
      border-radius: 17px;
      border: 1px solid #dfd1bf;
    }

    .account-section h2 {
      margin-bottom: 15px;
    }

    .order {
      border: 1px solid #dfd1bf;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      background: #fdf8f0;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      width: 100%;
      max-width: 450px;
      background: #fffaf2;
      border-radius: 18px;
      padding: 25px;
    }

    .modal-box h2 {
      margin-bottom: 18px;
    }

    .modal-box input,
    .modal-box select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #d6c6b2;
      border-radius: 10px;
      background: white;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-actions button {
      flex: 1;
    }

    .hidden {
      display: none !important;
    }

    #message {
      margin-top: 12px;
      line-height: 1.6;
    }

    .cart-item {
      padding: 13px;
      border-bottom: 1px solid #dfd1bf;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-total {
      padding: 18px 0;
      font-weight: bold;
      color: #765536;
    }

    @media(max-width:600px) {
      header {
        padding: 12px 4%;
      }

      .logo {
        font-size: 22px;
      }

      .header-actions .btn {
        padding: 9px 10px;
        font-size: 12px;
      }

      .hero {
        margin: 15px 4%;
        padding: 40px 25px;
      }

      .hero h1 {
        font-size: 31px;
      }

      main {
        padding: 0 4% 40px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    مِداد
    <span>MIDAD</span>
  </div>

  <div class="header-actions">
    <button class="btn" id="accountBtn">
      تسجيل الدخول
    </button>

    <button class="btn btn-light" id="cartBtn">
      السلة (<span id="cartCount">0</span>)
    </button>
  </div>

</header>


<main>

  <section class="hero">

    <h1>
      من التفاصيل تبدأ الحكاية
    </h1>

    <p>
      أدوات القهوة والشاي والماتشا المختارة بعناية.
    </p>

    <small>
      MIDAD — COFFEE & TEA SUPPLIES
    </small>

  </section>


  <div class="controls">

    <input
      id="searchInput"
      type="text"
      placeholder="ابحث عن منتج..."
    >

    <select id="categorySelect">
      <option value="">
        جميع الأقسام
      </option>
    </select>

  </div>


  <section
    id="productsGrid"
    class="products-grid">
  </section>


  <section
    id="accountSection"
    class="account-section hidden">

    <h2>
      حسابي
    </h2>

    <p id="profileInfo"></p>

    <h3 style="margin-top:25px;">
      طلباتي
    </h3>

    <div id="ordersList">
      لا توجد طلبات.
    </div>

  </section>

</main>


<!-- LOGIN / SIGNUP -->

<div
  id="authModal"
  class="modal">

  <div class="modal-box">

    <h2 id="authTitle">
      تسجيل الدخول
    </h2>

    <input
      id="emailInput"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="passwordInput"
      type="password"
      placeholder="كلمة المرور"
    >

    <div
      id="signupFields"
      class="hidden">

      <input
        id="nameInput"
        type="text"
        placeholder="الاسم الكامل"
      >

      <input
        id="phoneInput"
        type="text"
        placeholder="رقم الهاتف"
      >

      <input
        id="confirmPasswordInput"
        type="password"
        placeholder="تأكيد كلمة المرور"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn"
        id="authSubmit">
        دخول
      </button>

      <button
        class="btn btn-light"
        id="authSwitch">
        إنشاء حساب
      </button>

    </div>


    <button
      class="btn btn-light"
      id="authClose"
      style="width:100%;margin-top:8px;">
      إغلاق
    </button>

    <p id="authMessage"></p>

  </div>

</div>


<!-- CART -->

<div
  id="cartModal"
  class="modal">

  <div class="modal-box">

    <h2>
      السلة
    </h2>

    <div id="cartItems">
    </div>

    <div
      class="cart-total"
      id="cartTotal">
    </div>

    <select id="paymentMethod">

      <option value="cod">
        الدفع عند الاستلام
      </option>

      <option value="click">
        Click
      </option>

      <option value="bank_transfer">
        تحويل بنكي
      </option>

    </select>


    <div class="modal-actions">

      <button
        class="btn"
        id="checkoutBtn">
        تأكيد الطلب
      </button>

      <button
        class="btn btn-light"
        id="cartClose">
        إغلاق
      </button>

    </div>

    <p id="cartMessage"></p>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://fbmzettluevtekxrnfem.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_fi2aktOp4BP7c_KK2F5zTQ_l7X-thZD";


const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let products = [];

let cart =
  JSON.parse(
    localStorage.getItem("midad_cart") || "[]"
  );

let signupMode = false;


/* -------------------------
   ELEMENTS
------------------------- */

const productsGrid =
  document.getElementById("productsGrid");

const categorySelect =
  document.getElementById("categorySelect");

const searchInput =
  document.getElementById("searchInput");

const cartCount =
  document.getElementById("cartCount");


/* -------------------------
   LOAD CATEGORIES
------------------------- */

async function loadCategories() {

  const result =
    await db
      .from("categories")
      .select("*")
      .order("name");

  if (result.error) {
    console.error(result.error);
    return;
  }

  categorySelect.innerHTML =
    `<option value="">جميع الأقسام</option>`;

  result.data.forEach(category => {

    categorySelect.innerHTML += `
      <option value="${category.id}">
        ${category.name}
      </option>
    `;

  });

}


/* -------------------------
   LOAD PRODUCTS
------------------------- */

async function loadProducts() {

  const result =
    await db
      .from("products")
      .select(`
        *,
        categories (
          name
        )
      `)
      .eq("is_active", true)
      .order("name");

  if (result.error) {

    productsGrid.innerHTML =
      "<p>تعذر تحميل المنتجات.</p>";

    console.error(result.error);

    return;
  }

  products =
    result.data || [];

  renderProducts();

}


/* -------------------------
   RENDER PRODUCTS
------------------------- */

function renderProducts() {

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const category =
    categorySelect.value;


  const filtered =
    products.filter(product => {

      const matchesSearch =
        !search ||
        product.name
          .toLowerCase()
          .includes(search);

      const matchesCategory =
        !category ||
        product.category_id === category;

      return (
        matchesSearch &&
        matchesCategory
      );

    });


  if (!filtered.length) {

    productsGrid.innerHTML =
      "<p>لا توجد منتجات مطابقة.</p>";

    return;
  }


  productsGrid.innerHTML =
    filtered.map(product => {

      return `

        <article class="product-card">

          <div class="product-image">

            ☕

          </div>


          <h3>
            ${escapeHtml(product.name)}
          </h3>


          <div class="category">

            ${escapeHtml(
              product.categories?.name || ""
            )}

          </div>


          <div class="price">

            السعر عند الطلب

          </div>


          <div class="product-actions">

            <button
              class="btn"
              onclick="addToCart('${product.id}')">

              أضف للسلة

            </button>


            <button
              class="btn btn-light"
              onclick="addFavorite('${product.id}')">

              ♡

            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* -------------------------
   CART
------------------------- */

function saveCart() {

  localStorage.setItem(
    "midad_cart",
    JSON.stringify(cart)
  );

  renderCart();

}


function addToCart(productId) {

  const existing =
    cart.find(
      item => item.id === productId
    );


  if (existing) {

    existing.quantity++;

  } else {

    cart.push({
      id: productId,
      quantity: 1
    });

  }


  saveCart();

}


function removeFromCart(productId) {

  cart =
    cart.filter(
      item => item.id !== productId
    );

  saveCart();

}


function renderCart() {

  const totalItems =
    cart.reduce(
      (sum, item) =>
        sum + item.quantity,
      0
    );

  cartCount.textContent =
    totalItems;


  const container =
    document.getElementById("cartItems");


  if (!cart.length) {

    container.innerHTML =
      "<p>السلة فارغة.</p>";

    document.getElementById(
      "cartTotal"
    ).textContent = "";

    return;

  }


  let total = 0;


  container.innerHTML =
    cart.map(item => {

      const product =
        products.find(
          p => p.id === item.id
        );


      const price =
        Number(product?.price || 0);


      total +=
        price * item.quantity;


      return `

        <div class="cart-item">

          <span>
            ${escapeHtml(
              product?.name || "منتج"
            )}
            × ${item.quantity}
          </span>

          <button
            class="btn btn-light"
            onclick="removeFromCart('${item.id}')">

            حذف

          </button>

        </div>

      `;

    }).join("");


  document.getElementById(
    "cartTotal"
  ).textContent =
    "الإجمالي: " +
    total.toFixed(2);

}


/* -------------------------
   FAVORITES
------------------------- */

async function addFavorite(productId) {

  const session =
    await db.auth.getUser();

  const user =
    session.data.user;


  if (!user) {

    openAuth();

    return;

  }


  const result =
    await db
      .from("favorites")
      .upsert({
        user_id: user.id,
        product_id: productId
      });


  if (result.error) {

    alert(result.error.message);

  } else {

    alert("تمت الإضافة للمفضلة ❤️");

  }

}


/* -------------------------
   AUTH
------------------------- */

function openAuth() {

  document.getElementById(
    "authModal"
  ).style.display = "flex";

}


function closeAuth() {

  document.getElementById(
    "authModal"
  ).style.display = "none";

}


document.getElementById(
  "accountBtn"
).onclick = async function() {

  const result =
    await db.auth.getUser();

  if (result.data.user) {

    showAccount();

  } else {

    openAuth();

  }

};


document.getElementById(
  "authClose"
).onclick =
  closeAuth;


document.getElementById(
  "authSwitch"
).onclick =
  function() {

    signupMode =
      !signupMode;


    document.getElementById(
      "authTitle"
    ).textContent =
      signupMode
        ? "إنشاء حساب"
        : "تسجيل الدخول";


    document.getElementById(
      "signupFields"
    ).classList.toggle(
      "hidden",
      !signupMode
    );


    document.getElementById(
      "authSubmit"
    ).textContent =
      signupMode
        ? "إنشاء الحساب"
        : "دخول";


    document.getElementById(
      "authSwitch"
    ).textContent =
      signupMode
        ? "لدي حساب"
        : "إنشاء حساب";

  };


document.getElementById(
  "authSubmit"
).onclick =
  async function() {

    const email =
      document.getElementById(
        "emailInput"
      ).value.trim();

    const password =
      document.getElementById(
        "passwordInput"
      ).value;


    if (!email || !password) {

      document.getElementById(
        "authMessage"
      ).textContent =
        "أدخل البريد وكلمة المرور.";

      return;

    }


    if (signupMode) {

      const name =
        document.getElementById(
          "nameInput"
        ).value.trim();

      const phone =
        document.getElementById(
          "phoneInput"
        ).value.trim();

      const confirm =
        document.getElementById(
          "confirmPasswordInput"
        ).value;


      if (password !== confirm) {

        document.getElementById(
          "authMessage"
        ).textContent =
          "كلمتا المرور غير متطابقتين.";

        return;

      }


      const result =
        await db.auth.signUp({

          email,

          password,

          options: {

            data: {

              full_name: name,

              phone: phone

            }

          }

        });


      if (result.error) {

        document.getElementById(
          "authMessage"
        ).textContent =
          result.error.message;

      } else {

        document.getElementById(
          "authMessage"
        ).textContent =
          "تم إنشاء الحساب. إذا طلب منك تأكيد البريد، افحص بريدك الإلكتروني.";

      }


    } else {

      const result =
        await db.auth.signInWithPassword({

          email,

          password

        });


      if (result.error) {

        document.getElementById(
          "authMessage"
        ).textContent =
          result.error.message;

      } else {

        closeAuth();

        showAccount();

      }

    }

  };


/* -------------------------
   ACCOUNT
------------------------- */

async function showAccount() {

  const result =
    await db.auth.getUser();

  const user =
    result.data.user;


  if (!user) {

    openAuth();

    return;

  }


  document.getElementById(
    "accountSection"
  ).classList.remove("hidden");


  const profile =
    await db
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .single();


  if (profile.data) {

    document.getElementById(
      "profileInfo"
    ).innerHTML = `

      <b>
        ${escapeHtml(
          profile.data.full_name || ""
        )}
      </b>

      <br>

      ${escapeHtml(
        profile.data.email || user.email || ""
      )}

      <br>

      ${escapeHtml(
        profile.data.phone || ""
      )}

    `;

  }


  await loadOrders();

}


/* -------------------------
   ORDERS
------------------------- */

async function loadOrders() {

  const result =
    await db
      .from("orders")
      .select(`
        *,
        order_items (*)
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  const container =
    document.getElementById(
      "ordersList"
    );


  if (result.error) {

    container.textContent =
      "تعذر تحميل الطلبات.";

    return;

  }


  if (!result.data?.length) {

    container.textContent =
      "لا توجد طلبات حتى الآن.";

    return;

  }


  container.innerHTML =
    result.data.map(order => {

      return `

        <div class="order">

          <b>
            ${escapeHtml(
              order.order_number
            )}
          </b>

          <br>

          الحالة:
          ${escapeHtml(
            order.status
          )}

          <br>

          الدفع:
          ${escapeHtml(
            order.payment_method
          )}

          <br>

          الإجمالي:
          ${Number(
            order.total || 0
          ).toFixed(2)}

        </div>

      `;

    }).join("");

}


/* -------------------------
   CHECKOUT
------------------------- */

document.getElementById(
  "checkoutBtn"
).onclick =
  async function() {

    if (!cart.length) {

      document.getElementById(
        "cartMessage"
      ).textContent =
        "السلة فارغة.";

      return;

    }


    const session =
      await db.auth.getUser();

    const user =
      session.data.user;


    if (!user) {

      document.getElementById(
        "cartMessage"
      ).textContent =
        "يجب تسجيل الدخول أولًا.";

      return;

    }


    let total = 0;


    const items =
      cart.map(item => {

        const product =
          products.find(
            p => p.id === item.id
          );


        const price =
          Number(product?.price || 0);


        const subtotal =
          price * item.quantity;


        total += subtotal;


        return {

          product_id: item.id,

          product_name:
            product?.name || "منتج",

          quantity:
            item.quantity,

          unit_price:
            price,

          subtotal:
            subtotal

        };

      });


    const paymentMethod =
      document.getElementById(
        "paymentMethod"
      ).value;


    const orderResult =
      await db
        .from("orders")
        .insert({

          customer_id:
            user.id,

          payment_method:
            paymentMethod,

          total:
            total

        })
        .select()
        .single();


    if (orderResult.error) {

      document.getElementById(
        "cartMessage"
      ).textContent =
        orderResult.error.message;

      return;

    }


    const order =
      orderResult.data;


    const itemResult =
      await db
        .from("order_items")
        .insert(

          items.map(item => ({

            ...item,

            order_id:
              order.id

          }))

        );


    if (itemResult.error) {

      document.getElementById(
        "cartMessage"
      ).textContent =
        itemResult.error.message;

      return;

    }


    cart = [];

    saveCart();


    document.getElementById(
      "cartMessage"
    ).innerHTML = `

      تم إنشاء طلبك بنجاح ✅

      <br>

      رقم الطلب:

      <b>
        ${escapeHtml(
          order.order_number
        )}
      </b>

    `;


    await loadOrders();

  };


/* -------------------------
   CART MODAL
------------------------- */

document.getElementById(
  "cartBtn"
).onclick =
  function() {

    renderCart();

    document.getElementById(
      "cartModal"
    ).style.display =
      "flex";

  };


document.getElementById(
  "cartClose"
).onclick =
  function() {

    document.getElementById(
      "cartModal"
    ).style.display =
      "none";

  };


/* -------------------------
   SEARCH
------------------------- */

searchInput.oninput =
  renderProducts;

categorySelect.onchange =
  renderProducts;


/* -------------------------
   SECURITY HELPER
------------------------- */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* -------------------------
   START
------------------------- */

async function startMidad() {

  await loadCategories();

  await loadProducts();

  renderCart();


  const session =
    await db.auth.getUser();


  if (session.data.user) {

    showAccount();

  }

}


startMidad();

</script>

</body>
</html>
