/* =========================================================
   LOAD PRODUCTS FROM SUPABASE
========================================================= */

async function loadProducts(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select(`
        id,
        name,
        slug,
        description,
        price,
        price_visible,
        image_url,
        is_active,
        stock,
        category_id,
        categories(
          name,
          slug
        )
      `)
      .order("created_at");

  if(error){

    console.error(error);

    alert("تعذر تحميل منتجات مِداد من قاعدة البيانات.");

    return;

  }

  products =
    (data || []).map(p=>{

      const meta =
        productMeta[p.slug] || {};

      const categorySlug =
        p.categories?.slug ||
        meta.category ||
        "coffee-tools";

      return {

        ...p,

        title:
          meta.title ||
          p.name,

        category:
          categorySlug,

        categoryName:
          meta.categoryName ||
          categoryMap[categorySlug]?.name ||
          p.categories?.name ||
          "مِداد",

        description:
          meta.description ||
          p.description ||
          "منتج من مِداد",

        imageKey:
          meta.imageKey ||
          p.slug

      };

    });

  renderProducts();

}


/* =========================================================
   STORE RENDER
========================================================= */

function renderProducts(){

  const area =
    document.getElementById("productsArea");

  if(!area){
    return;
  }

  const search =
    (
      document.getElementById("searchInput")
        ?.value || ""
    ).trim().toLowerCase();

  const filter =
    document.getElementById("categoryFilter")
      ?.value || "all";

  let html = "";

  categoryOrder.forEach(category=>{

    if(
      filter !== "all" &&
      filter !== category
    ){
      return;
    }

    const list =
      products.filter(p=>{

        if(!p.is_active){
          return false;
        }

        const matchesCategory =
          p.category === category;

        const text =
          (
            p.title +
            " " +
            p.name +
            " " +
            p.description
          ).toLowerCase();

        const matchesSearch =
          !search ||
          text.includes(search);

        return matchesCategory &&
               matchesSearch;

      });

    if(!list.length){
      return;
    }

    html += `

      <div class="category">

        <div class="category-title">

          <h3>
            ${categoryMap[category]?.name || "مِداد"}
          </h3>

          <span></span>

        </div>

        <div class="products-grid">

    `;

    list.forEach(p=>{

      const isFav =
        favorites.includes(p.id);

      const image =
        p.image_url ||
        imageFor(p.imageKey,p.title);

      const price =
        Number(p.price || 0);

      html += `

        <article
          class="product-card"
          onclick="openProduct('${p.id}')">

          <button
            class="favorite"
            onclick="event.stopPropagation();toggleFavorite('${p.id}')">

            ${isFav ? "♥" : "♡"}

          </button>

          <div class="product-image">

            <img
              src="${image}"
              alt="${p.title}">

          </div>

          <div class="product-info">

            <h4>
              ${p.title}
            </h4>

            <div class="product-description">
              ${p.description}
            </div>

            <div class="product-bottom">

              <span class="product-price">

                ${
                  p.price_visible && price > 0
                  ? price.toFixed(2)+" د.أ"
                  : "السعر عند الطلب"
                }

              </span>

              <button
                class="add-btn"
                onclick="event.stopPropagation();addToCart('${p.id}')"
                ${Number(p.stock) <= 0 ? "disabled" : ""}>

                ${
                  Number(p.stock) <= 0
                  ? "نفد المخزون"
                  : "أضف للسلة"
                }

              </button>

            </div>

          </div>

        </article>

      `;

    });

    html += `

        </div>

      </div>

    `;

  });

  if(!html){

    html = `
      <div class="empty">
        لا توجد منتجات مطابقة للبحث.
      </div>
    `;

  }

  area.innerHTML = html;

}

/* =========================================================
   CART
========================================================= */

function addToCart(id){

  const p =
    products.find(x=>x.id===id);

  if(
    !p ||
    !p.is_active ||
    Number(p.stock) <= 0
  ){

    alert("هذا المنتج غير متوفر حالياً.");

    return;

  }

  const existing =
    cart.find(x=>x.id===id);

  if(existing){

    if(
      existing.qty >= Number(p.stock)
    ){

      alert("لا توجد كمية إضافية متوفرة.");

      return;

    }

    existing.qty++;

  }else{

    cart.push({
      id,
      qty:1
    });

  }

  saveCart();
  renderCart();
  updateCartCount();

}


function saveCart(){

  localStorage.setItem(
    "midad_cart",
    JSON.stringify(cart)
  );

}


function removeFromCart(id){

  cart =
    cart.filter(x=>x.id!==id);

  saveCart();
  renderCart();
  updateCartCount();

}


function changeQty(id,delta){

  const item =
    cart.find(x=>x.id===id);

  const p =
    products.find(x=>x.id===id);

  if(!item || !p){
    return;
  }

  item.qty += delta;

  if(item.qty <= 0){

    removeFromCart(id);

    return;

  }

  if(item.qty > Number(p.stock)){

    item.qty =
      Number(p.stock);

  }

  saveCart();
  renderCart();
  updateCartCount();

}


function updateCartCount(){

  const count =
    cart.reduce(
      (sum,item)=>
        sum + Number(item.qty),
      0
    );

  document
    .getElementById("cartCount")
    .textContent = count;

}


function renderCart(){

  const box =
    document.getElementById("cartItems");

  if(!cart.length){

    box.innerHTML = `
      <div class="empty">
        السلة فارغة حالياً.
      </div>
    `;

    return;

  }

  box.innerHTML =
    cart.map(item=>{

      const p =
        products.find(x=>x.id===item.id);

      if(!p){
        return "";
      }

      const price =
        Number(p.price || 0);

      return `

        <div class="cart-item">

          <div>

            <h4>
              ${p.title}
            </h4>

            <small>

              ${
                p.price_visible && price > 0
                ? price.toFixed(2)+" د.أ"
                : "السعر عند الطلب"
              }

            </small>

          </div>

          <div class="cart-controls">

            <button
              class="qty-btn"
              onclick="changeQty('${p.id}',1)">
              +
            </button>

            <strong>
              ${item.qty}
            </strong>

            <button
              class="qty-btn"
              onclick="changeQty('${p.id}',-1)">
              −
            </button>

            <button
              class="remove-btn"
              onclick="removeFromCart('${p.id}')">
              حذف
            </button>

          </div>

        </div>

      `;

    }).join("");

}


function openCart(){

  renderCart();

  document

  document

/* =========================================================
   CREATE REAL SUPABASE ORDER
========================================================= */

async function sendOrder(){

  if(!cart.length){

    alert("السلة فارغة.");

    return;

  }

  const name =
    document
      .getElementById("customerName")
      .value.trim();

  const phone =
    document
      .getElementById("customerPhone")
      .value.trim();

  const address =
    document
      .getElementById("customerAddress")
      .value.trim();

  const payment =
    document
      .getElementById("paymentMethod")
      .value;

  if(!name || !phone || !address){

    alert(
      "يرجى تعبئة الاسم ورقم الهاتف والعنوان."
    );

    return;

  }


  let total = 0;

  const itemRows = [];

  for(const item of cart){

    const p =
      products.find(x=>x.id===item.id);

    if(!p){
      continue;
    }

    const price =
      Number(p.price || 0);

    const subtotal =
      price * Number(item.qty);

    total += subtotal;

    itemRows.push({

      product_id:p.id,

      product_name:p.title,

      quantity:Number(item.qty),

      unit_price:price,

      subtotal:subtotal

    });

  }


  const orderNumber =
    "MID-" +
    Date.now();


  const {
    data:order,
    error:orderError
  } =
    await supabaseClient
      .from("orders")
      .insert({

        order_number:orderNumber,

        customer_id:null,

        customer_name:name,

        customer_phone:phone,

        delivery_address:address,

        status:"pending",

        payment_method:
          payment === "click"
          ? "click"
          : "cod",

        payment_status:"pending",

        total:total

      })
      .select()
      .single();


  if(orderError){

    console.error(orderError);

    alert(
      "تعذر حفظ الطلب في قاعدة البيانات.\n"+
      orderError.message
    );

    return;

  }


  const rows =
    itemRows.map(item=>({

      ...item,

      order_id:order.id

    }));


  if(rows.length){

    const {
      error:itemError
    } =
      await supabaseClient
        .from("order_items")
        .insert(rows);

    if(itemError){

      console.error(itemError);

      alert(
        "تم إنشاء الطلب ولكن حدث خطأ في تفاصيل المنتجات."
      );

      return;

    }

  }


  let message =
    `طلب جديد من مِداد%0A%0A`;

  message +=
    `رقم الطلب: ${encodeURIComponent(orderNumber)}%0A`;

  message +=
    `الاسم: ${encodeURIComponent(name)}%0A`;

  message +=
    `الهاتف: ${encodeURIComponent(phone)}%0A`;

  message +=
    `العنوان: ${encodeURIComponent(address)}%0A`;

  message +=
    `طريقة الدفع: ${
      payment === "click"
      ? "Click - بنك الاتحاد"
      : "الدفع عند الاستلام"
    }%0A%0A`;

  message +=
    `المنتجات:%0A`;


  cart.forEach(item=>{

    const p =
      products.find(x=>x.id===item.id);

    if(p){

      message +=
        `• ${encodeURIComponent(p.title)} × ${item.qty}%0A`;

    }

  });


  if(payment === "click"){

    message +=
      `%0Aبيانات Click:%0A`;

    message +=
      `بنك الاتحاد%0A`;

    message +=
      `Ibrahim Nidar Mohammad Yousef%0A`;

    message +=
      `0799563650%0A`;

  }


  cart = [];

  saveCart();

  updateCartCount();

  renderCart();

  closeCheckout();


  alert(
    "تم تسجيل طلبك في نظام مِداد بنجاح."
  );


  window.open(
    "https://wa.me/962799563650?text="+message,
    "_blank"
  );


  if(
    document
      .getElementById("admin")
      .classList.contains("active")
  ){

    await loadAdminOrders();

  }

}

async function adminLogin(){

      .value.trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;

  const error =
    document
      .getElementById("adminLoginError");

    error.textContent =

    return;

  }


  const {
    data,
    error:loginError
  } =
    await supabaseClient.auth
      .signInWithPassword({

        email,
        password

      });


  if(loginError){

    console.error(loginError);

    error.textContent =
      "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

    return;

  }


  await verifyAdmin(data.user);

}


/* =========================================================
   VERIFY OWNER / STAFF
========================================================= */

async function verifyAdmin(user){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("user_roles")
      .select("role")
      .eq("user_id",user.id)
      .maybeSingle();


  if(error){

    console.error(error);

    document
      .getElementById("adminLoginError")
      .textContent =
      "حدث خطأ أثناء التحقق من صلاحيات الإدارة.";

    return;

  }


  if(
    !data ||
    !["owner","manager","staff"].includes(data.role)
  ){

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminLoginError")
      .textContent =
      "هذا الحساب لا يملك صلاحية إدارة مِداد.";

    return;

  }


  document
    .getElementById("adminLoginOverlay")
    .classList.remove("active");


  document
    .getElementById("store")
    .classList.add("hidden");


  document
    .getElementById("admin")
    .classList.add("active");


  await renderAdmin();

  window.scrollTo(0,0);

}

        id,
        name,
        slug,
        price,

        stock,
        categories(
          name,

        )
      `)

                value="false"

              </option>

            </select>

          </td>

        </tr>

      `;

    }).join("");

}


/* =========================================================
   ADMIN PRODUCT UPDATE
========================================================= */

async function updateProductPrice(id,value){

  const price =
    Math.max(
      0,
      Number(value) || 0
    );


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .update({

        price:price,

        price_visible:
          price > 0

      })
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "تعذر تحديث السعر."
    );

    return;

  }

}


async function updateProductStock(id,value){

  const stock =
    Math.max(
      0,
      Number(value) || 0
    );


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .update({

        stock:stock

      })
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "تعذر تحديث المخزون."
    );

    return;

  }

}


async function updateProductActive(id,value){

  const active =
    value === "true";


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .update({

        is_active:active

      })
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "تعذر تحديث حالة المنتج."
    );

    return;

  }


  await loadProducts();

}

/* =========================================================
   TOGGLE ALL SALES
========================================================= */

async function toggleAllSales(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("is_active");


  if(error){

    alert("تعذر قراءة حالة المنتجات.");

    return;

  }


  const shouldEnable =
    (data || []).some(
      p=>!p.is_active
    );


  const {
    error:updateError
  } =
    await supabaseClient
      .from("products")
      .update({

        is_active:
          shouldEnable

      })
      .neq(
        "id",
        "00000000-0000-0000-0000-000000000000"
      );


  if(updateError){

    console.error(updateError);

    alert(
      "تعذر تغيير حالة البيع."
    );

    return;

  }


  await loadProducts();

  await loadAdminProducts();

  await updateAdminStats();


  alert(
    shouldEnable
    ? "تم تفعيل البيع لجميع المنتجات."
    : "تم تعطيل البيع لجميع المنتجات."
  );

}

/* =========================================================
   ADMIN ORDER DISPLAY
========================================================= */

function renderAdminOrders(){

  const box =
    document.getElementById("adminOrders");


  if(!orders.length){

    box.innerHTML = `

      <div class="empty">
        لا توجد طلبات حالياً.
      </div>

    `;

    return;

  }


  box.innerHTML =
    orders.map(order=>{

      const date =
        new Date(order.created_at)
          .toLocaleString("ar-JO");


      const items =
        (order.order_items || [])
          .map(item=>
            `${item.product_name} × ${item.quantity}`
          )
          .join("، ");


      return `

        <div class="order-card">

          <strong>
            ${order.order_number}
          </strong>

          <br>

          <small>
            ${date}
          </small>

          <hr
            style="
              margin:10px 0;
              border:0;
              border-top:1px solid #dfd0bf;
            ">

          <strong>
            العميل:
          </strong>

          ${order.customer_name || "-"}

          <br>

          <strong>
            الهاتف:
          </strong>

          ${order.customer_phone || "-"}

          <br>

          <strong>
            العنوان:
          </strong>

          ${order.delivery_address || "-"}

          <br><br>

          <strong>
            المنتجات:
          </strong>

          ${items || "-"}

          <br>

          <strong>
            الدفع:
          </strong>

          ${
            order.payment_method === "click"
            ? "Click"
            : "الدفع عند الاستلام"
          }

          <br>

          <strong>
            الإجمالي:
          </strong>

          ${
            Number(order.total || 0).toFixed(2)
          }
          د.أ

          <br><br>

          <span class="status">
            ${
              translateStatus(
                order.status
              )
            }
          </span>

        </div>

      `;

    }).join("");

}


function translateStatus(status){

  const map = {

    pending:"جديد",

    confirmed:"تم التأكيد",

    preparing:"قيد التجهيز",

    ready:"جاهز",

    out_for_delivery:"خرج للتوصيل",

    delivered:"تم التسليم",

    cancelled:"ملغي"

  };

  return map[status] || status || "جديد";

}


/* =========================================================
   ADMIN STATS — REAL DATABASE
========================================================= */

async function updateAdminStats(){

  const {
    count:productCount
  } =
    await supabaseClient
      .from("products")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      );


  const {
    data:stockData
  } =
    await supabaseClient
      .from("products")
      .select("stock");


  const totalStock =
    (stockData || []).reduce(
      (sum,p)=>
        sum + Number(p.stock || 0),
      0
    );


  const {
    count:orderCount
  } =
    await supabaseClient
      .from("orders")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      );


  const {
    data:salesData
  } =
    await supabaseClient
      .from("orders")
      .select("total")
      .neq(
        "status",
        "cancelled"
      );


  const totalSales =
    (salesData || []).reduce(
      (sum,o)=>
        sum + Number(o.total || 0),
      0
    );


  document
    .getElementById("statProducts")
    .textContent =
      productCount || 0;


  document
    .getElementById("statStock")
    .textContent =
      totalStock;


  document
    .getElementById("statOrders")
    .textContent =
      orderCount || 0;


  document
    .getElementById("statSales")
    .textContent =
      totalSales > 0
      ? totalSales.toFixed(2)+" د.أ"
      : "0";


}
