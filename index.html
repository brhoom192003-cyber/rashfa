<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رشفة | مستلزمات القهوة</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: #fff;
    }

    header {
      background: #111;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #c9a227;
    }

    .logo {
      color: #d4af37;
      font-size: 30px;
      font-weight: bold;
    }

    .cart {
      color: #d4af37;
      font-size: 18px;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(180deg, #151515, #0b0b0b);
    }

    .hero h1 {
      color: #d4af37;
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      font-size: 20px;
    }

    .products {
      padding: 50px 8%;
    }

    .products h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 35px;
      font-size: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .product {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      transition: 0.3s;
    }

    .product:hover {
      transform: translateY(-5px);
      border-color: #d4af37;
    }

    .product .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .product h3 {
      margin-bottom: 12px;
    }

    .price {
      color: #d4af37;
      margin-bottom: 20px;
      font-weight: bold;
    }

    button {
      background: #d4af37;
      color: #111;
      border: none;
      padding: 12px 22px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #f0cf55;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 30px;
      border-top: 1px solid #333;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">رَشْفَة ☕</div>
    <div class="cart">
      🛒 السلة: <span id="cartCount">0</span>
    </div>
  </header>

  <section class="hero">
    <h1>كل رشفة تبدأ من هنا ☕</h1>
    <p>مستلزمات القهوة التي تحتاجها في مكان واحد</p>
  </section>

  <section class="products">
    <h2>منتجاتنا</h2>

    <div class="grid">

      <div class="product">
        <div class="icon">☕</div>
        <h3>أكواب قهوة</h3>
        <div class="price">ابتداءً من 2 د.أ</div>
        <button onclick="addToCart()">أضف للسلة</button>
      </div>

      <div class="product">
        <div class="icon">⚗️</div>
        <h3>أدوات التقطير</h3>
        <div class="price">ابتداءً من 5 د.أ</div>
        <button onclick="addToCart()">أضف للسلة</button>
      </div>

      <div class="product">
        <div class="icon">🫘</div>
        <h3>مستلزمات البن</h3>
        <div class="price">ابتداءً من 3 د.أ</div>
        <button onclick="addToCart()">أضف للسلة</button>
      </div>

      <div class="product">
        <div class="icon">⚖️</div>
        <h3>موازين القهوة</h3>
        <div class="price">ابتداءً من 8 د.أ</div>
        <button onclick="addToCart()">أضف للسلة</button>
      </div>

    </div>
  </section>

  <footer>
    © 2026 رشفة | جميع الحقوق محفوظة
  </footer>

  <script>
    let cart = 0;

    function addToCart() {
      cart++;
      document.getElementById("cartCount").textContent = cart;
    }
  </script>

</body>
</html>
